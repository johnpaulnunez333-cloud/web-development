<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Manantan Digital Works</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-card">
            <a class="auth-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/Logo.jpg') }}" alt="MDW logo">
                <span>Manantan Digital Works</span>
            </a>
            <h1>Sign in</h1>
            <p class="auth-sub">Welcome back to the Manantan network.</p>
            <form id="login-form" novalidate>
                <div class="field">
                    <label for="login-email">Email address</label>
                    <div class="field-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <div class="field-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" name="password" placeholder="Your password" autocomplete="current-password" required>
                        <button type="button" class="reveal-btn" data-reveal="login-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-error" id="login-error" role="alert"></div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
            <div class="auth-switch">
                New here? <a href="{{ url_for('signup') }}">Create an account</a>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/auth-common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
