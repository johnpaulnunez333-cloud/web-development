<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Manantan Digital Works</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-extra.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-card">
            <a class="auth-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/Logo.jpg') }}" alt="MDW logo">
                <span>Manantan Digital Works</span>
            </a>

            <div id="login-view">
                <h1>Sign in</h1>
                <p class="auth-sub">Welcome back to the Manantan network.</p>
                <div class="form-info" id="login-info" role="status"></div>
                <form id="login-form" novalidate>
                    <div class="field">
                        <label for="login-email">Email address</label>
                        <div class="field-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <div class="field-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="login-password" name="password" placeholder="Your password" autocomplete="current-password" required>
                            <button type="button" class="reveal-btn" data-reveal="login-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="forgot-row">
                        <button type="button" class="link-btn" id="forgot-link">Forgot password?</button>
                    </div>
                    <div class="form-error" id="login-error" role="alert"></div>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </form>
                <div class="auth-switch">
                    New here? <a href="{{ url_for('signup') }}">Create an account</a>
                </div>
            </div>

            <div id="reset-view" hidden>
                <h1>Reset password</h1>
                <p class="auth-sub" id="reset-sub">Enter your email and we will send a 6-digit code to your inbox.</p>

                <form id="forgot-form" novalidate>
                    <div class="field">
                        <label for="forgot-email">Email address</label>
                        <div class="field-box">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="forgot-email" name="email" placeholder="you@example.com" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="form-error" id="forgot-error" role="alert"></div>
                    <button type="submit" class="btn btn-primary">Send code</button>
                </form>

                <form id="reset-form" hidden novalidate>
                    <div class="form-info" id="reset-info" role="status"></div>
                    <div class="field">
                        <label for="reset-code">6-digit code</label>
                        <div class="field-box">
                            <i class="fa-solid fa-key"></i>
                            <input type="text" id="reset-code" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
                        </div>
                    </div>
                    <div class="field">
                        <label for="reset-password">New password</label>
                        <div class="field-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="reset-password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                            <button type="button" class="reveal-btn" data-reveal="reset-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                        </div>
                        <p class="field-hint">Use at least 8 characters with a letter and a number.</p>
                    </div>
                    <div class="field">
                        <label for="reset-confirm">Confirm new password</label>
                        <div class="field-box">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="reset-confirm" placeholder="Repeat your new password" autocomplete="new-password" required>
                        </div>
                    </div>
                    <div class="form-error" id="reset-error" role="alert"></div>
                    <button type="submit" class="btn btn-primary">Update password</button>
                    <div class="forgot-row center-row">
                        <button type="button" class="link-btn" id="resend-code">Send a new code</button>
                    </div>
                </form>

                <div class="auth-switch">
                    <a href="#" id="back-to-login">Back to sign in</a>
                </div>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/auth-common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
