<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Portfolio | MDW Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-books.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-extra.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-shop.css') }}">
</head>
<body data-base="{{ base }}">
    <div class="admin-wrap">
        {% set admin_active = 'portfolio' %}
        {% include '_admin_nav.html' %}

        <main class="admin-main">
            <header class="admin-top">
                <button type="button" class="btn btn-ghost side-toggle" id="sideToggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
                <h1>Portfolio</h1>
                <a class="btn btn-ghost" href="/portfolio" target="_blank" rel="noopener" style="margin-left:auto"><i class="fa-solid fa-arrow-up-right-from-square"></i> View public page</a>
            </header>

            <div class="card">
                <h3 id="formTitle">Add a project</h3>
                <form id="projectForm" class="book-form" novalidate>
                    <label class="form-label" for="pTitle">Project title</label>
                    <input type="text" id="pTitle" maxlength="120" placeholder="Example: Barangay Records Website" autocomplete="off">

                    <div class="two-inputs">
                        <div>
                            <label class="form-label" for="pCategory">Category</label>
                            <select id="pCategory">
                                {% for name in categories %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="form-label" for="pOrder">Display order (small first)</label>
                            <input type="text" id="pOrder" inputmode="numeric" placeholder="0" value="0">
                        </div>
                    </div>

                    <label class="form-label" for="pDescription">Description</label>
                    <textarea id="pDescription" rows="3" maxlength="1200" placeholder="What the project does and who it was built for"></textarea>

                    <label class="form-label" for="pTech">Tools used (comma separated)</label>
                    <input type="text" id="pTech" maxlength="200" placeholder="Flask, PostgreSQL, JavaScript" autocomplete="off">

                    <label class="form-label" for="pLink">Link (optional)</label>
                    <input type="text" id="pLink" maxlength="300" placeholder="https://example.com or /shop" autocomplete="off">

                    <label class="form-label" for="pImage">Project picture (optional, PNG/JPEG/WebP, 3 MB max)</label>
                    <div class="cover-picker">
                        <img id="pPreview" class="cover-preview" alt="Preview" hidden>
                        <input type="file" id="pImage" accept="image/png,image/jpeg,image/webp">
                    </div>
                    <label class="muted small" id="removeWrap" hidden><input type="checkbox" id="pRemove"> Remove the current picture</label>

                    <div class="form-error" id="projectError" role="alert"></div>
                    <div class="row-actions">
                        <button type="submit" class="btn btn-primary" id="projectBtn"><i class="fa-solid fa-plus"></i> Add project</button>
                        <button type="button" class="btn btn-ghost" id="cancelEdit" hidden>Cancel edit</button>
                    </div>
                </form>
            </div>

            <div class="card" style="margin-top: 20px;">
                <div class="toolbar">
                    <h3 style="margin: 0;">Projects</h3>
                    <span class="muted small" id="projectNote"></span>
                </div>
                <div class="table-wrap"><table class="data-table" id="projectsTable"></table></div>
            </div>
        </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="{{ url_for('static', filename='js/admin-common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin-portfolio.js') }}"></script>
</body>
</html>
