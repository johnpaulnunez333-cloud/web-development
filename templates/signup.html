<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Manantan Digital Works</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-card">
            <a class="auth-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/Logo.jpg') }}" alt="MDW logo">
                <span>Manantan Digital Works</span>
            </a>
            <h1>Create your account</h1>
            <p class="auth-sub">Join the Manantan network, pick an avatar, and take the skills quiz.</p>
            <form id="register-form" novalidate>
                <div class="field">
                    <label for="register-name">Full name</label>
                    <div class="field-box">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="register-name" name="full_name" placeholder="Juan Dela Cruz" autocomplete="name" maxlength="80" required>
                    </div>
                </div>
                <div class="field">
                    <label for="register-email">Email address</label>
                    <div class="field-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="register-email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>
                <div class="field">
                    <label for="register-password">Password</label>
                    <div class="field-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="register-password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="reveal-btn" data-reveal="register-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                    </div>
                    <p class="field-hint">Use at least 8 characters with a letter and a number.</p>
                </div>
                <div class="field">
                    <label for="register-confirm">Confirm password</label>
                    <div class="field-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="register-confirm" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required>
                    </div>
                </div>
                <div class="form-error" id="register-error" role="alert"></div>
                <button type="submit" class="btn btn-primary">Create account</button>
            </form>
            <div class="auth-switch">
                Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/auth-common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
