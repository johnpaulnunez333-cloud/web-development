<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Shop | Manantan Digital Works</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/books.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shop.css') }}">
</head>
<body data-name="{{ user.full_name }}">
    {% set active = 'shop' %}
    {% include '_nav.html' %}
    <main class="page">
        <div class="page-head shop-head">
            <div>
                <h1>Electronics Shop</h1>
                <p class="muted">Circuits, modules, sensors, and parts from the Manantan team.</p>
            </div>
            <div class="shop-actions">
                <button type="button" class="btn btn-ghost" id="ordersBtn"><i class="fa-solid fa-receipt"></i> My orders</button>
                <button type="button" class="btn btn-primary" id="cartBtn"><i class="fa-solid fa-cart-shopping"></i> Cart <span class="cart-count" id="cartCount">0</span></button>
            </div>
        </div>

        <div class="shop-toolbar">
            <div class="books-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="shopSearch" placeholder="Search products" aria-label="Search products">
            </div>
            <div class="chip-filters" id="categoryChips"></div>
        </div>

        <div class="product-grid" id="productGrid"></div>
        <p class="books-empty" id="shopEmpty" hidden></p>
    </main>

    <div class="drawer-overlay" id="drawerOverlay" hidden></div>
    <aside class="drawer" id="cartDrawer" hidden>
        <div class="drawer-head">
            <h3>Your cart</h3>
            <button type="button" class="icon-close" id="cartClose" aria-label="Close cart"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-body">
            <div id="cartItems"></div>
            <form id="checkoutForm" novalidate hidden>
                <h4>Delivery details</h4>
                <label for="coName">Full name</label>
                <input type="text" id="coName" maxlength="80" autocomplete="name">
                <label for="coPhone">Phone number</label>
                <input type="tel" id="coPhone" maxlength="30" autocomplete="tel" placeholder="09XX XXX XXXX">
                <label for="coAddress">Complete address</label>
                <textarea id="coAddress" rows="2" maxlength="300" autocomplete="street-address"></textarea>
                <label for="coNotes">Notes (optional)</label>
                <textarea id="coNotes" rows="2" maxlength="300" placeholder="Example: call before delivery"></textarea>
                <p class="muted small">Payment is arranged with the seller after you place the order.</p>
                <div class="form-error" id="checkoutError" role="alert"></div>
                <button type="submit" class="btn btn-primary" id="placeOrderBtn">Place order</button>
            </form>
        </div>
        <div class="drawer-foot" id="cartFoot" hidden>
            <span>Total</span>
            <strong id="cartTotal">₱0.00</strong>
        </div>
    </aside>

    <div class="modal-overlay" id="ordersModal" hidden>
        <div class="modal-box">
            <div class="drawer-head">
                <h3>My orders</h3>
                <button type="button" class="icon-close" id="ordersClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="orders-list" id="ordersList"></div>
        </div>
    </div>

    <div class="toast" id="shopToast" role="status"></div>
    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
    <script src="{{ url_for('static', filename='js/shop.js') }}"></script>
</body>
</html>
